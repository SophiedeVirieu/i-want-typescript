name: compile-my-app
run-name: let compile i-want-typescript
on:
  push:
    branches:
      - main
jobs:
  installations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
      - name: checkout
        run: actions/checkout@v6
        
      - run: npm ci
      - run: npm run build
      - run: npm test
